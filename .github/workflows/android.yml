name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and verify debug APK
        run: ./gradlew clean testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NetSpeedAndroid-v1.6.apk
      - uses: actions/upload-artifact@v7
        with:
          name: NetSpeedAndroid-v1.6
          path: NetSpeedAndroid-v1.6.apk
          if-no-files-found: error
